name: Hello World
description: Everyday greetings
inputs:
  language:
    description: Greeting to be given language
    required: false
    default: "Java"
outputs:
  result_status:
    description: Status of the result
    value: ${{steps.result_id.outputs.result_value}}

runs:
  using: composite
  steps:
    - run: echo "Hello World"
      shell: bash
    - run: echo ${{inputs.language}}
      shell: bash
    - name: result output
      id: result_id
      run: echo "result_value=Success" >> "$GITHUB_OUTPUT"
      shell: bash