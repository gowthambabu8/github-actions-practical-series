name: Python Setup
description: Python Setup
inputs:
  owner-name:
    description: Name of the repo owner
    type: string
outputs:
  ack:
    description: send off msg
    value: ${{steps.see-you.outputs.msg}}
runs:
  using: composite
  steps:
    - name: welcome
      env:
        OWNER: ${{inputs.owner-name}}
      run: echo "Welcome $OWNER"
      shell: bash
    - name: send off
      run: echo "Bye Bye"
      shell: bash
    - name: see you again
      id: see-you
      env:
        OWNER: ${{inputs.owner-name}}
      run: |
        echo "msg=see you again $OWNER" >> $GITHUB_OUTPUT
      shell: bash