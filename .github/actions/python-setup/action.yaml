name: Python Setup
description: Python Setup
inputs:
  owner-name:
    description: Name of the repo owner
    type: string
    required: true
runs:
  using: composite
  steps:
    - name: welcome
      env:
        OWNER: ${{inputs.owner-name}}
      run: echo "Welcome $OWNER"
      shell: bash
    - name: send off
      run: echo "Bye Bye"
      shell: bash
    - name: see you again
      run: echo "see you again"
      shell: bash