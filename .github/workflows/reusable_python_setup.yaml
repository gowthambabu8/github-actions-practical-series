name: Reusable Python Setup
on: 
    workflow_call:
        inputs:
            py-version:
                description: "required python version for setup"
                required: true
                type: string
jobs:
    python-setup:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: create cache pip folder
              run: mkdir -p ~/.cache/pip
            - name: setup python and cache
              uses: actions/setup-python@v4
              with:
                python-version: ${{inputs.py-version}}
                cache: pip
                #cache-dependency-path: requirements.txt
