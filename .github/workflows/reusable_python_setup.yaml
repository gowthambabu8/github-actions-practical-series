name: Reusable Python Setup
on: 
    workflow_call:
        inputs:
            py-version:
                description: "required python version for setup"
                required: true
                type: string
        secrets:
            DOCKER_TOKEN:
                description: "docker PAT required to push image to docker hub"
                required: true
jobs:
    python-setup:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: create cache pip folder
              run: mkdir -p ~/.cache/pip
            - name: setup python and cache
              uses: actions/setup-python@v4
              with:
                python-version: ${{inputs.py-version}}
                cache: pip
                #cache-dependency-path: requirements.txt
            - name: deploying to docker
              env:
                docker_token_value: ${{secrets.DOCKER_TOKEN}}
              run: |
                echo "Docker token is $docker_token_value" 
