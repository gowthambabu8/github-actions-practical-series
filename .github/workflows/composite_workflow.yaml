name: Composite Workflow
on:
    push:
        branches: main
        paths: .github/workflows/composite_workflow.yaml

jobs:
    python-setup:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: calling composite action
              id: get-send-off-msg
              uses: ./.github/actions/python-setup
              with:
                owner-name: "Gowtham"
            - name: Printinf send off msg
              env:
                message: ${{steps.get-send-off-msg.outputs.msg}}
              run: echo "Received message is $message"
