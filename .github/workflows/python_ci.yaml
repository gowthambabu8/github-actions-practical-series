name: Python CI
on:
    push:
        branches: ["main"]
        paths: ".github/workflows/python_ci.yaml"
defaults:
    run:
        working-directory: python
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip
            - name: install required libraries
              run: pip install -r requirements.txt
            - name: apply linting
              run: flake8 app tests --max-line-length=100

    tests:
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                version: ["3.10","3.12"]
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: setup python
              uses: actions/setup-python@v5
              with: 
                python-version: ${{matrix.version}}
                cache: pip
            - name: install libraries
              run : pip install -r requirements.txt
            - name: run tests
              run: pytest --cov=app --cov-report=xml --cov-fail-under=80
            - run: |
                pwd
                ls -la coverage.xml
                echo ${{github.workspace}}
            - name: upload artifacts
              uses: actions/upload-artifact@v4
              with: 
                name: coverage-${{matrix.version}}
                path: ${{github.workspace}}/python/coverage.xml
            - name: download artifacts
              uses: actions/download-artifact@v4
              with:
                name: coverage-${{matrix.version}}
