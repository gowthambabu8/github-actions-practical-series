name: Dependency Caching
on: [push, pull_request, workflow_dispatch]
defaults:
  run:
    working-directory: node-app
jobs:
    cache-basic:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: node setup
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name: npm continous integration
              run: npm ci
            - run: npm test