name: Reusable Workflow
on: 
    workflow_call:
      inputs:
        py-version:
          description: "python version to setup"
          required: false
          type: string
          default: "3.12"
      secrets:
        docker-token:
          description: PAT for docker access
          required: true


jobs:
    setup-python:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v4
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: ${{inputs.py-version}}
                cache: pip
            - name: Pushing build to Docker
              run: | 
                "echo printing docker PAT :: " 
                ${{secrets.docker-token}}
