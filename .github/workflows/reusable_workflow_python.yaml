name: Reusable Workflow
on: 
    workflow_call:
      inputs:
        py-version:
          description: "python version to setup"
          required: false
          type: string
          default: "3.12"
      secrets:
        docker-token:
          description: PAT for docker access
          required: true
      outputs:
        call-version:
          description: github sha value
          value: ${{jobs.setup-python.outputs.JOB_VERSION}}


jobs:
    setup-python:
        runs-on: ubuntu-latest
        outputs:
          JOB_VERSION: ${{steps.gen-output-id.outputs.version}}
        steps:
            - name: Code Checkout
              uses: actions/checkout@v4
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: ${{inputs.py-version}}
                cache: pip
            - name: Pushing build to Docker
              env:
                DOCKER_TOKEN: ${{secrets.docker-token}}
              run: | 
                echo "printing docker PAT :: $DOCKER_TOKEN "
            - name: generating output
              id: gen-output-id
              run: |
                echo "GH_SHA=${{github.sha}}"
                echo "version=$GH_SHA" >> $GITHUB_OUTPUT
