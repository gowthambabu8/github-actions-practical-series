name: Using Actions
on:
    push:
        branches: main
        paths: .github/workflows/workflow_actions.yaml
jobs:
    action-job:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: calling composite action
              id: exec_id
              uses: ./.github/actions/hello
            - name: printing final output
              run: echo ${{steps.exec_id.outputs.result_status}}
