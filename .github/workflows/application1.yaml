name: Application 1
on:
    push:
        branches: main
        paths: .github/workflows/application1.yaml
defaults:
    run:
        working-directory: python   
jobs:
    call-setup-python:
        uses: ./.github/workflows/reusable_workflow_python.yaml
        with:
            py-version: "3.10"
        secrets:
            docker-token: "sdhgkjsgkl"
    
    get-output:
        runs-on: ubuntu-latest
        needs: call-setup-python
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: output value
              env:
                GH-SHA: ${{needs.call-setup-python.outputs.call-version}}
              run: |
                echo "printing output :: $GH-SHA"


    
